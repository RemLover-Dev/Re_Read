name: Build Windows and Linux

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.label }} x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            bundles: nsis,msi
          - os: ubuntu-22.04
            label: Linux
            bundles: deb,appimage
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install Node dependencies
        run: npm ci
      - name: Check synchronized versions and tag
        id: version
        run: npm run release:check
      - name: Test the frontend and parsers
        run: npm test
      - name: Prepare application icons
        run: npm run release:icons
      - name: Build Tauri installers
        uses: tauri-apps/tauri-action@v1
        with:
          args: --bundles ${{ matrix.bundles }}
      - name: Collect installers and checksums
        run: node scripts/collect-release.mjs
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ReRead-${{ steps.version.outputs.version }}-${{ matrix.label }}-x64
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create draft release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: ReRead-*-x64
          path: release-assets
          merge-multiple: true
      - name: Create or publish release after both builds succeed
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state.txt 2>/dev/null; then
            if [ "$(cat release-state.txt)" != 'true' ]; then
              echo 'This release is already published; refusing to replace its assets.' >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest --title "Re:Read $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --latest --title "Re:Read $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
